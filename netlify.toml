# Netlify configuration — Next.js 16 via the Next.js Runtime (OpenNext adapter)
# Docs: https://docs.netlify.com/integrations/frameworks/next-js/overview

[build]
  command = "npm run build"
  # Must not equal the base directory; the Next.js Runtime validates it
  # and then takes over publishing (routing, SSR functions, caching).
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
