# Netlify configuration — Next.js 16 via the Next.js Runtime (OpenNext adapter)
# Docs: https://docs.netlify.com/integrations/frameworks/next-js/overview

[build]
  command = "npm run build"
  # Do NOT set `publish`. The Next.js Runtime manages build output,
  # routing, SSR functions and caching automatically.

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
